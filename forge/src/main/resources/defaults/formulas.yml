# 公式计算模板
# 所有派生属性、资源参数和战斗计算公式都集中在这个文件。
# 配置结构键使用英文，公式中的属性 ID 可以直接使用中文。
# 变量使用短占位符，例如 <力量>、<目标.护甲>、<lvl>。
# 支持四则运算、比较、条件表达式、Math.pow/min/max、floor/ceil/abs。
#
# Molang 参考：YSM 的动画指令帧可以调用以下函数。
#   ysa.attr('力量')
#   ysa.damage(1.44, '物理')
# ysa.damage 表示攻击者基础伤害的 1.44 倍，最终结果由服务端重新计算。

context:
  # <lvl>：当前角色等级。
  <lvl>: 当前角色等级
  # <prev>：上一等级的升级经验要求，用于连续经验曲线。
  <prev>: 上一等级的升级经验要求
  # <目标.属性名>：读取受击目标的同名属性，例如 <目标.护甲>。
  <目标.属性名>: 受击目标的同名属性
  # <本次是否暴击>：由暴击概率事件决定，0 表示未暴击，1 表示暴击。
  <本次是否暴击>: 战斗事件输入，0 或 1
  # 最高权重元素()：内置函数，返回权重最高的元素名称。
  最高权重元素(): 返回权重最高的元素名称

resources:
  # 生命上限和生命恢复属于 Minecraft 原生生命系统的派生数值。
  生命上限: "<耐力> * 18.8"
  生命恢复速度: "<精神> * 1.2"
  # 法力：与精力、集中使用同一套资源接口；这里沿用原有测试公式。
  法力上限: "<智力> * 15.6"
  法力恢复速度: "<专注> * 2.3"
  # 精力：测试用固定上限和恢复速度。
  精力上限: "500"
  精力恢复速度: "40"
  # 充能：由其他 Mod 或插件通过接口增加和消耗。
  充能上限: "100"
  充能衰减速度: "0"
  # 集中：测试用固定上限和恢复速度。
  集中上限: "100"
  集中恢复速度: "10"

damage:
  # 基础伤害：力量和武器伤害先合并，再应用基础伤害倍率。
  基础伤害: "(<力量> * 6.6 + <武器伤害>) * <基础伤害加成>"
  # 无属性部分默认占 30 权重；元素权重会额外影响总权重。
  无属性伤害权重: "30 + (<炽炎> + <冰霜> + <狂风> + <雷暴> + <圣光> + <暗影>) * 0.5"
  总伤害权重: "<无属性伤害权重> + <炽炎> + <冰霜> + <狂风> + <雷暴> + <圣光> + <暗影>"
  无属性伤害: "<基础伤害> * <无属性伤害权重> / <总伤害权重> * <无属性伤害加成>"
  # 以下六项分别计算对应元素的原始伤害。
  炽炎伤害: "<基础伤害> * <炽炎> / <总伤害权重> * <炽炎伤害加成>"
  冰霜伤害: "<基础伤害> * <冰霜> / <总伤害权重> * <冰霜伤害加成>"
  狂风伤害: "<基础伤害> * <狂风> / <总伤害权重> * <狂风伤害加成>"
  雷暴伤害: "<基础伤害> * <雷暴> / <总伤害权重> * <雷暴伤害加成>"
  圣光伤害: "<基础伤害> * <圣光> / <总伤害权重> * <圣光伤害加成>"
  暗影伤害: "<基础伤害> * <暗影> / <总伤害权重> * <暗影伤害加成>"

mitigation:
  # 减伤先按目标属性计算，之后在暴击前伤害中统一扣除。
  护甲减伤: "<目标.护甲> * 0.25 * <目标.护甲减伤加成>"
  炽炎减伤: "<目标.炽炎抗性> * 0.3 * <目标.炽炎减伤加成>"
  冰霜减伤: "<目标.冰霜抗性> * 0.3 * <目标.冰霜减伤加成>"
  狂风减伤: "<目标.狂风抗性> * 0.3 * <目标.狂风减伤加成>"
  雷暴减伤: "<目标.雷暴抗性> * 0.3 * <目标.雷暴减伤加成>"
  圣光减伤: "<目标.圣光抗性> * 0.3 * <目标.圣光减伤加成>"
  暗影减伤: "<目标.暗影抗性> * 0.3 * <目标.暗影减伤加成>"

critical:
  # 暴击概率只负责决定本次是否暴击，暴击倍率在最终结算阶段使用。
  暴击概率: "(<暴击> + <目标.暴击抗性> <= 0) ? 0 : <暴击> / (<暴击> + <目标.暴击抗性>)"
  暴击前伤害: "<无属性伤害> + <元素伤害总和> - <元素减伤总和> - <护甲减伤>"
  暴击伤害: "<暴击前伤害> * <暴击倍率>"
  最终伤害: "<本次是否暴击> == 1 ? <暴击伤害> : <暴击前伤害>"

runtime:
  元素亲和: "最高权重元素(<炽炎>, <冰霜>, <狂风>, <雷暴>, <圣光>, <暗影>)"
  元素伤害总和: "<炽炎伤害> + <冰霜伤害> + <狂风伤害> + <雷暴伤害> + <圣光伤害> + <暗影伤害>"
  元素减伤总和: "<炽炎减伤> + <冰霜减伤> + <狂风减伤> + <雷暴减伤> + <圣光减伤> + <暗影减伤>"
