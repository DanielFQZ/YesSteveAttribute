# 角色与职业基础数值模板
# 配置结构键使用英文，角色 ID、显示名称和属性 ID 可以使用中文。
# 这里只写基础属性和随等级变化的公式；派生属性统一由 formulas.yml 计算。

roles:
  示例战士:
    # display_name：在 UI 或日志中显示的角色名称。
    display_name: 示例战士
    # level_rule：引用 levels.yml 中的等级规则 ID。
    level_rule: 默认
    # upgrade_conditions：只放这个职业额外需要的升级条件。
    upgrade_conditions: []
    # base：角色在起始等级的六项基础属性。
    base:
      力量: 10
      耐力: 12
      敏捷: 6
      精神: 4
      智力: 2
      专注: 3
    # growth：以 <lvl> 为变量的成长公式；这里只填写一级属性。
    growth:
      力量: "10 + 0.6 * Math.pow(<lvl>, 1.6)"
      耐力: "12 + 0.8 * Math.pow(<lvl>, 1.5)"
      敏捷: "6 + 0.3 * <lvl>"
      精神: "4 + 0.2 * <lvl>"
      智力: "2 + 0.1 * <lvl>"
      专注: "3 + 0.15 * <lvl>"

  示例法师:
    display_name: 示例法师
    level_rule: 默认
    upgrade_conditions: []
    base:
      力量: 2
      耐力: 6
      敏捷: 5
      精神: 8
      智力: 12
      专注: 10
    growth:
      力量: "2 + 0.1 * <lvl>"
      耐力: "6 + 0.4 * Math.pow(<lvl>, 1.4)"
      敏捷: "5 + 0.25 * <lvl>"
      精神: "8 + 0.5 * <lvl>"
      智力: "12 + 0.8 * Math.pow(<lvl>, 1.5)"
      专注: "10 + 0.7 * Math.pow(<lvl>, 1.4)"
