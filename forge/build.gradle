plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = mod_id
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments = ['-Xmx4G', '-Xms1G', '-XX:+IgnoreUnrecognizedVMOptions']
        }
    }

    mods {
        yessteveattribute {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

legacyForge.addModdingDependenciesTo(sourceSets.gameTest)
legacyForge.runs.gameTestServer.gameDirectory = layout.buildDirectory.dir('gametest-run')
def prepareGameTestStructures = tasks.register('prepareGameTestStructures', Copy) {
    from('src/gameTest/structures')
    into(layout.buildDirectory.dir('gametest-run/gameteststructures'))
}
legacyForge.runs.gameTestServer.taskBefore(prepareGameTestStructures)

// Explicit opt-in to test the external YSS release jar; no production dependency or bundling.
if (providers.gradleProperty('yssIntegrationJar').isPresent()) {
    def integrationJar = file(providers.gradleProperty('yssIntegrationJar').get())
    if (!integrationJar.isFile() || integrationJar.name != 'yessteveskill-1.0.jar')
        throw new GradleException('yssIntegrationJar must point to the built yessteveskill-1.0.jar')
    repositories.flatDir {
        dirs integrationJar.parentFile
        content { includeGroup 'ysa.integration' }
    }
    dependencies.add('modRuntimeOnly', 'ysa.integration:yessteveskill:1.0')
    legacyForge.runs.gameTestServer.systemProperty 'ysa.testYss', 'true'
}

// Forge Main can return exit code 0 after a startup error. Require an actual GameTest completion.
tasks.named('runGameTestServer').configure {
    def resultLog = layout.buildDirectory.file('gametest-run/logs/latest.log')
    doFirst {
        resultLog.get().asFile.parentFile.mkdirs()
        resultLog.get().asFile.setText('', 'UTF-8')
    }
    doLast {
        def logText = resultLog.get().asFile.getText('UTF-8')
        if (!logText.contains('9 GAME TESTS COMPLETE') || !logText.contains('All 9 required tests passed :)')) {
            throw new GradleException('Expected all 9 combat/resource/skill GameTests to pass; inspect ' + resultLog.get().asFile)
        }
        if (providers.gradleProperty('yssIntegrationJar').isPresent() && (!logText.contains('YSS integration checks passed') || !logText.contains('YSS skill cost checks passed'))) {
            throw new GradleException('YSS integration checks did not complete; inspect ' + resultLog.get().asFile)
        }
    }
}

repositories {
    mavenLocal {
        content {
            includeModule 'com.elfmcys.ysm', 'ysm'
        }
    }
}

dependencies {
    implementation project(':core')
    // Forge 发行版依赖 YSM；客户端类通过 Dist.CLIENT 隔离，专用服务器不解析这些类。
    modImplementation "com.elfmcys.ysm:ysm:${ysm_version}"
    // Production embeds SnakeYAML below; development launches need it on the legacy library classpath.
    legacyForge.runs.each { run ->
        add(run.additionalRuntimeClasspathConfiguration.name, "org.yaml:snakeyaml:${snakeyaml_version}")
    }
    // YSM's server model loader uses LWJGL memory buffers; server runs do not extract client natives.
    def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def nativeOs = hostOs.contains('win') ? 'windows' : (hostOs.contains('mac') ? 'macos' : 'linux')
    def nativeArch = hostArch in ['aarch64', 'arm64'] ? '-arm64' : (hostArch in ['x86', 'i386'] ? '-x86' : '')
    add(legacyForge.runs.gameTestServer.additionalRuntimeClasspathConfiguration.name,
            "org.lwjgl:lwjgl:3.3.1:natives-${nativeOs}${nativeArch}")
    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// LegacyForge wires Minecraft onto main only. Reader tests use the same mapped classes.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version: forge_version,
                             forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id: mod_id,
                             mod_name: mod_name,
                             mod_license: mod_license,
                             mod_version: mod_version,
                             mod_authors: mod_authors,
                             mod_description: mod_description,
                             ysm_version: ysm_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 将独立 core 的类和 SnakeYAML 一并放入 Forge jar，便于整合包只安装一个 YSA 文件。
tasks.named('jar', Jar).configure {
    dependsOn project(':core').tasks.named('classes')
    from(project(':core').sourceSets.main.output)
    from({ configurations.runtimeClasspath
            .findAll { it.name.startsWith('snakeyaml-') }
            .collect { zipTree(it) } })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(['Specification-Title': mod_id,
                    'Specification-Vendor': mod_authors,
                    'Specification-Version': '1',
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor': mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    // YSA 通过 FMLClientSetup 直接注册绑定，不使用 YSM 的兼容性注解处理器。
    // 这样不会在成品 jar 生成与 YSS 相同的 fingerprint 包。
}
