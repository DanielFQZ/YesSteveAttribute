# Formula definitions
# All derived attributes and combat calculations stay in this file.
# Structure keys are English; attribute IDs inside expressions may be Chinese.
# Variables use short placeholders: <力量>, <目标.护甲>, <lvl>.
# Supported syntax: + - * /, comparisons, ?:, Math.pow/min/max, floor/ceil/abs.
#
# Molang reference for a YSM animation command frame:
#   ysa.attr('力量')
#   ysa.damage(1.44, '物理')
# ysa.damage uses 1.44 times the attacker's 基础伤害. The server recalculates it.

context:
  <lvl>: current role level
  <prev>: previous level-up experience requirement
  <目标.属性名>: same attribute read from the target
  <本次是否暴击>: combat input, 0 or 1, decided from 暴击概率
  最高权重元素(): built-in function returning the highest elemental weight

resources:
  生命上限: "<耐力> * 18.8"
  生命恢复速度: "<精神> * 1.2"
  精力上限: "500"
  精力恢复速度: "40"
  充能上限: "100"
  充能衰减速度: "0"
  集中上限: "100"
  # 集中恢复速度暂以 0 作为测试默认值，确定数值后直接改这里。
  集中恢复速度: "0"

damage:
  基础伤害: "(<力量> * 6.6 + <武器伤害>) * <基础伤害加成>"
  无属性伤害权重: "30 + (<炽炎> + <冰霜> + <狂风> + <雷暴> + <圣光> + <暗影>) * 0.5"
  总伤害权重: "<无属性伤害权重> + <炽炎> + <冰霜> + <狂风> + <雷暴> + <圣光> + <暗影>"
  无属性伤害: "<基础伤害> * <无属性伤害权重> / <总伤害权重> * <无属性伤害加成>"
  炽炎伤害: "<基础伤害> * <炽炎> / <总伤害权重> * <炽炎伤害加成>"
  冰霜伤害: "<基础伤害> * <冰霜> / <总伤害权重> * <冰霜伤害加成>"
  狂风伤害: "<基础伤害> * <狂风> / <总伤害权重> * <狂风伤害加成>"
  雷暴伤害: "<基础伤害> * <雷暴> / <总伤害权重> * <雷暴伤害加成>"
  圣光伤害: "<基础伤害> * <圣光> / <总伤害权重> * <圣光伤害加成>"
  暗影伤害: "<基础伤害> * <暗影> / <总伤害权重> * <暗影伤害加成>"

mitigation:
  护甲减伤: "<目标.护甲> * 0.25 * <目标.护甲减伤加成>"
  炽炎减伤: "<目标.炽炎抗性> * 0.3 * <目标.炽炎减伤加成>"
  冰霜减伤: "<目标.冰霜抗性> * 0.3 * <目标.冰霜减伤加成>"
  狂风减伤: "<目标.狂风抗性> * 0.3 * <目标.狂风减伤加成>"
  雷暴减伤: "<目标.雷暴抗性> * 0.3 * <目标.雷暴减伤加成>"
  圣光减伤: "<目标.圣光抗性> * 0.3 * <目标.圣光减伤加成>"
  暗影减伤: "<目标.暗影抗性> * 0.3 * <目标.暗影减伤加成>"

critical:
  暴击概率: "(<暴击> + <目标.暴击抗性> <= 0) ? 0 : <暴击> / (<暴击> + <目标.暴击抗性>)"
  暴击前伤害: "<无属性伤害> + <元素伤害总和> - <元素减伤总和> - <护甲减伤>"
  暴击伤害: "<暴击前伤害> * <暴击倍率>"
  最终伤害: "<本次是否暴击> == 1 ? <暴击伤害> : <暴击前伤害>"

runtime:
  元素亲和: "最高权重元素(<炽炎>, <冰霜>, <狂风>, <雷暴>, <圣光>, <暗影>)"
  元素伤害总和: "<炽炎伤害> + <冰霜伤害> + <狂风伤害> + <雷暴伤害> + <圣光伤害> + <暗影伤害>"
  元素减伤总和: "<炽炎减伤> + <冰霜减伤> + <狂风减伤> + <雷暴减伤> + <圣光减伤> + <暗影减伤>"
