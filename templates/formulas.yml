# 公式计算模板
# 所有计算公式集中在这一个文件中；属性定义见 attributes.yml。
# 表达式使用短变量：<力量>、<目标.护甲>、<lvl> 等。
# 公式引擎需要支持四则运算、比较、条件表达式、Math.pow/Math.min/Math.max、floor、ceil、abs。
# Molang 参考（由 Forge 端注册，YSM 动画帧中使用）：
#   ysa.attr('力量')
#   ysa.attack('attack1', 1.44, '物理')
#   ysa.attack('attack1', 1.44, '物理', ysa.attr('基础伤害'))
# 这些调用只提交动作/伤害意图，最终数值仍由服务端公式计算。

公式上下文:
  # 这些是运行时输入，不是属性定义文件中的属性。
  <玩家初始速度>: 由平台提供
  <默认攻击间隔>: 1
  <技能阶段攻速倍率>: 由动作或技能提供
  <目标.属性名>: 目标的同名属性
  最高权重元素(): 内置函数，返回权重最高的元素名称

# 怒气上限和怒气恢复速度尚未配置公式；在确认前禁止把它们作为可计算输入。

资源:
  生命上限: "<耐力> * 18.8"
  生命恢复速度: "<精神> * 1.2"
  法力上限: "<智力> * 15.6"
  法力恢复速度: "<专注> * 2.3"
  # 怒气的成长公式尚未在数值设计文档中指定，暂不计算。

移动与攻击:
  移动速度加成: "-1 / (0.01 * <敏捷> + 1) + 1"
  最终移动速度: "<玩家初始速度> * (1 + <移动速度加成>)"
  跳跃高度加成: "-4 / (0.01 * <敏捷> + 1) + 4"
  攻击间隔减免: "-1 / (0.008 * <敏捷> + 1) + 1"
  最终攻击间隔: "<默认攻击间隔> * <技能阶段攻速倍率> * (1 - <攻击间隔减免>)"

基础伤害:
  基础伤害: "(<力量> * 6.6 + <武器伤害>) * <基础伤害加成>"
  无属性伤害权重: "30 + (<炽炎> + <冰霜> + <狂风> + <雷暴> + <圣光> + <暗影>) * 0.5"
  总伤害权重: "<无属性伤害权重> + <炽炎> + <冰霜> + <狂风> + <雷暴> + <圣光> + <暗影>"
  无属性伤害: "<基础伤害> * <无属性伤害权重> / <总伤害权重> * <无属性伤害加成>"

元素伤害:
  炽炎伤害: "<基础伤害> * <炽炎> / <总伤害权重> * <炽炎伤害加成>"
  冰霜伤害: "<基础伤害> * <冰霜> / <总伤害权重> * <冰霜伤害加成>"
  狂风伤害: "<基础伤害> * <狂风> / <总伤害权重> * <狂风伤害加成>"
  雷暴伤害: "<基础伤害> * <雷暴> / <总伤害权重> * <雷暴伤害加成>"
  圣光伤害: "<基础伤害> * <圣光> / <总伤害权重> * <圣光伤害加成>"
  暗影伤害: "<基础伤害> * <暗影> / <总伤害权重> * <暗影伤害加成>"

减伤:
  护甲减伤: "<目标.护甲> * 0.25 * <目标.护甲减伤加成>"
  炽炎减伤: "<目标.炽炎抗性> * 0.3 * <目标.炽炎减伤加成>"
  冰霜减伤: "<目标.冰霜抗性> * 0.3 * <目标.冰霜减伤加成>"
  狂风减伤: "<目标.狂风抗性> * 0.3 * <目标.狂风减伤加成>"
  雷暴减伤: "<目标.雷暴抗性> * 0.3 * <目标.雷暴减伤加成>"
  圣光减伤: "<目标.圣光抗性> * 0.3 * <目标.圣光减伤加成>"
  暗影减伤: "<目标.暗影抗性> * 0.3 * <目标.暗影减伤加成>"

暴击:
  # 双方数值都为 0 时返回 0，避免除零。
  暴击概率: "(<暴击> + <目标.暴击抗性> <= 0) ? 0 : <暴击> / (<暴击> + <目标.暴击抗性>)"
  暴击伤害: "<暴击前伤害> * <暴击倍率>"

元素判定:
  # 这是枚举结果，不是伤害数值；用于选择最高权重元素的表现或暴击技能。
  元素亲和: "最高权重元素(<炽炎>, <冰霜>, <狂风>, <雷暴>, <圣光>, <暗影>)"

最终结算:
  # 目前按“无属性伤害 + 各元素伤害 - 各元素减伤 - 护甲减伤”展开。
  # 元素减伤、护甲减伤的上限以及最终伤害是否至少为 0，仍需作者确认。
  元素伤害总和: "<炽炎伤害> + <冰霜伤害> + <狂风伤害> + <雷暴伤害> + <圣光伤害> + <暗影伤害>"
  元素减伤总和: "<炽炎减伤> + <冰霜减伤> + <狂风减伤> + <雷暴减伤> + <圣光减伤> + <暗影减伤>"
  最终伤害: "<无属性伤害> + <元素伤害总和> - <元素减伤总和> - <护甲减伤>"

评分:
  # 设计文档尚未提供 RATE/RATING 的具体算法；null 表示暂不执行。
  RATE: null
  RATING: null
