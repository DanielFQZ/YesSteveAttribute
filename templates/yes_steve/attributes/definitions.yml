# 属性定义。属性 ID 稳定，中文 name/aliases 方便作者和 UI 使用。
attributes:
  - id: empyrean:max_health
    name: 最大生命
    aliases: [生命上限, 最大生命值]
    unit: flat
    default: 20
    aggregation: additive
    stages: [base, additive, multiplicative, final]

  - id: empyrean:strength
    name: 力量
    aliases: [攻击力, 物理攻击力]
    unit: flat
    default: 0
    aggregation: additive

  - id: empyrean:attack_power
    name: 攻击强度
    aliases: [伤害, 攻击伤害]
    unit: flat
    default: 1
    aggregation: derived
    formula: "<力量> + <武器强度>"

  - id: empyrean:weapon_power
    name: 武器强度
    aliases: [武器攻击]
    unit: flat
    default: 0
    aggregation: additive

  - id: empyrean:armor
    name: 护甲
    aliases: [物理防御, 防御力]
    unit: flat
    default: 0
    aggregation: additive

  - id: empyrean:physical_resistance
    name: 物理抗性
    aliases: [物理减伤]
    unit: ratio
    default: 0
    range: [0, 0.9]
    aggregation: additive

  - id: empyrean:fire_resistance
    name: 火焰抗性
    aliases: [火焰减伤]
    unit: ratio
    default: 0
    range: [0, 0.9]
    aggregation: additive

  - id: empyrean:crit_chance
    name: 暴击率
    aliases: [暴击概率]
    unit: chance
    default: 0
    range: [0, 1]
    aggregation: additive

  - id: empyrean:crit_multiplier
    name: 暴击倍率
    aliases: [暴击伤害]
    unit: multiplier
    default: 1.5
    range: [1, 10]
    aggregation: additive

  - id: empyrean:crit_resistance
    name: 暴击抵抗
    unit: chance
    default: 0
    range: [0, 1]
    aggregation: additive

  - id: empyrean:fire_crit_chance
    name: 火焰暴击率
    unit: chance
    default: 0
    range: [0, 1]
    aggregation: additive

  - id: empyrean:fire_crit_resist
    name: 火焰暴击抵抗
    unit: chance
    default: 0
    range: [0, 1]
    aggregation: additive

  - id: empyrean:fire_crit_multiplier
    name: 火焰暴击倍率
    unit: multiplier
    default: 1.75
    range: [1, 10]
    aggregation: additive

  - id: empyrean:fire_penetration
    name: 火焰穿透
    unit: ratio
    default: 0
    range: [0, 1]
    aggregation: additive

  - id: empyrean:echo_cost_limit
    name: 声骸费用上限
    unit: flat
    default: 10
    aggregation: additive

  - id: empyrean:stamina
    name: 体力
    unit: flat
    default: 100
    aggregation: additive
