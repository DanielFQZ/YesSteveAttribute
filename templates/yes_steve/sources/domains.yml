# 可注册的投放层。新增系统优先写一个来源域，不要修改核心属性计算器。
domains:
  - id: empyrean:progression
    name: 成长
    kind: progression
    phase: base
    persistent: true
    output: [AttributeContribution, CapabilityGrant]

  - id: empyrean:base_class
    name: 职业基础
    kind: actor_template
    phase: base
    persistent: true
    output: [AttributeContribution, CapabilityGrant]

  - id: empyrean:equipment
    name: 装备
    kind: loadout
    phase: equipment
    container: equipment_slots
    output: [AttributeContribution, CapabilityGrant, EventEffect]
    instance_policy: live

  - id: empyrean:accessory
    name: 饰品
    kind: loadout
    phase: equipment
    container: accessory_slots
    capacity: 4
    output: [AttributeContribution, CapabilityGrant, EventEffect]
    instance_policy: frozen

  - id: empyrean:artifact
    name: 圣遗物
    kind: loadout
    phase: equipment
    container: artifact_slots
    slots: [flower, plume, sands, goblet, circlet]
    output: [AttributeContribution, CapabilityGrant, EventEffect]
    instance_policy: frozen

  - id: empyrean:echo
    name: 声骸
    kind: loadout
    phase: equipment
    container: echo_slots
    capacity: 5
    output: [AttributeContribution, CapabilityGrant, RuleModifier, EventEffect]
    instance_policy: frozen

  - id: empyrean:buff
    name: Buff
    kind: temporary
    phase: buff
    output: [AttributeContribution, CapabilityGrant, EventEffect, ResourceModifier]
    persistent: false

# phase 控制聚合阶段，来源域本身不决定伤害顺序。
phases:
  - id: base
    order: 10
  - id: equipment
    order: 20
  - id: buff
    order: 30
  - id: derived
    order: 40
  - id: final
    order: 50
