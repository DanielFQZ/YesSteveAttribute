# UI API 与具体 UI 实现解耦。
# MineBrowse、DragonCore、原生界面和第三方插件都实现适配器。
api:
  id: empyrean:attribute_ui
  schema_version: 1
  transport: platform_defined
  authority: server

queries:
  - id: ysa.attribute.snapshot
    method: read
    permission: self
    request:
      subject: uuid
      selector: [attributes, sources, progression, loadout]
    response:
      schema_version: 1
      snapshot_version: integer
      server_tick: integer
      subject: uuid
      attributes: snapshot
      sources: source_tree

  - id: ysa.attribute.explain
    method: read
    permission: self
    request:
      subject: uuid
      attribute_id: namespaced_id
    response: trace

  - id: ysa.attribute.preview
    method: preview
    permission: self
    request:
      subject: uuid
      changes: loadout_delta
    response:
      preview_only: true
      snapshot: snapshot

  - id: ysa.loadout.validate
    method: validate
    permission: self
    request:
      subject: uuid
      changes: loadout_delta
    response: validation_report

events:
  topics:
    - attribute.snapshot_changed
    - attack_started
    - hit_confirmed
    - critical_hit
    - element_reaction
    - damage_applied
    - attack_finished
  payload:
    schema_version: 1
    snapshot_version: integer
    server_tick: integer
    attack_id: optional_uuid
    subject: uuid
    topic: string
    data: object

adapters:
  - id: empyrean:minebrowse
    platform: [forge, paper]
    map_methods_to: [registerMethod, emit]
  - id: empyrean:dragoncore
    platform: [paper]
    map_snapshot_to: dragoncore_variables
    map_events_to: dragoncore_callbacks
