# Paper 端 MythicMobs 适配层。
# MythicMobs 负责技能触发、条件、目标选择和时序；YSA 负责属性、公式、Proc 和伤害结算。
integration:
  plugin: MythicMobs
  required_for_paper_adapter: true
  native_placeholders_are_read_only: true

placeholders:
  # 这些占位符由 YSA 注册给 MythicMobs，不会修改 MythicMobs 原有占位符。
  caster_attribute: "<caster.ysa.属性名>"
  target_attribute: "<target.ysa.属性名>"
  caster_progression: "<caster.ysa.level>"
  target_progression: "<target.ysa.level>"
  source_value: "<caster.ysa.source.来源ID.属性名>"

mechanics:
  # 该机制创建一次 DamageRequest，完成 Proc/抗性计算，然后只调用一次原版伤害入口。
  ysa-damage:
    profile_parameter: profile
    tags_parameter: tags
    call_vanilla_damage_once: true
    use_mythic_targeter: true

  # 将 YSA Buff 绑定到 MythicMobs 技能组的施法者或目标。
  ysa-buff:
    buff_parameter: buff
    duration_parameter: duration
    use_mythic_targeter: true

  # 给实体的 ProgressionState 增加经验或设置等级。
  ysa-progression:
    track_parameter: track
    value_parameter: value
    mode_parameter: mode
    allowed_modes: [add_exp, set_level, add_level]

  # 只提供经过权限检查的属性来源或临时修正，不允许技能直接写最终属性快照。
  ysa-attribute:
    attribute_parameter: attribute
    value_parameter: value
    mode_parameter: mode
    allowed_modes: [add_source, remove_source, preview]

skill_examples:
  # MythicMobs 仍然使用原有的 Conditions、Targeters、repeat 和 delay。
  轻斩:
    Skills:
      - ysa-damage{profile=empyrean:light_slash;tags=melee,physical} @target

  火焰声骸:
    Conditions:
      - offgcd
      - hasaura{aura=empyrean:ember_ready}
    Skills:
      - ysa-damage{profile=empyrean:burning_tick;tags=fire,dot} @target

  战吼:
    Skills:
      - ysa-buff{buff=empyrean:war_cry;duration=200} @self

damage_policy:
  # YSA 伤害使用 ysa-damage；普通 MythicMobs Damage 仍可以用于不接入属性系统的原版技能。
  ysa_damage: authoritative
  mythic_damage: vanilla_compatible
  reject_double_application: true
  # MythicMobs 的 DamageModifiers 只处理没有被 YSA 标记的伤害，避免重复扣抗性。
  respect_mythic_damage_modifiers_for_ysa_damage: false

entity_mapping:
  # MythicMobs 的 Health/Damage 是实体生成基线；YSA 快照负责 RPG 属性。
  level: "<caster.level>"
  mythic_type: "<caster.mythictype>"
  display_name: "<caster.display>"
  ysa_attributes: "<caster.ysa.属性名>"
