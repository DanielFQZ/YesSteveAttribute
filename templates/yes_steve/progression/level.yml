# 等级是 ProgressionState，不是普通属性来源。
# 其他公式通过 <lvl> 读取当前实体等级。
id: empyrean:player_level
type: progression_track
name: 玩家等级
aliases: [等级, 玩家等级]

state:
  start_level: 1
  max_level: 100
  experience: 0
  level: 1

experience:
  # previous_required 是上一级升级所需经验；level 是当前等级。
  next_required:
    segments:
      - when: "<lvl> <= 10"
        formula: "500 + <lvl> * 120"
      - when: "<lvl> <= 30"
        formula: "1000 * Math.pow(<lvl>, 1.35)"
      - when: "<lvl> > 30"
        formula: "<prev> * 1.25"
  overflow_policy: retain

ascension:
  # 每十级需要一次升阶；具体任务由项目自己的任务系统提供。
  - id: empyrean:ascension_1
    when: "<lvl> >= 10 && <lvl> % 10 == 0"
    require:
      - quest:empyrean:ascension_1
    block_level_up: true
    consume_on_complete: false
  - id: empyrean:ascension_2
    when: "<lvl> >= 30 && <lvl> % 10 == 0"
    require:
      - quest:empyrean:ascension_2
    block_level_up: true

# 等级成长会生成可追踪的 empyrean:level_growth 来源。
growth:
  source_id: empyrean:level_growth
  contributions:
    - attribute: empyrean:max_health
      formula: "100 + Math.pow(<lvl>, 1.2) * 12"
    - attribute: empyrean:strength
      formula: "8 + <lvl> * 1.5"
    - attribute: empyrean:armor
      formula: "<lvl> * 0.8"

unlock:
  - when: "<lvl> >= 10"
    grant_source: empyrean:advanced_relic_slots
  - when: "<lvl> >= 20"
    grant_source: empyrean:echo_resonance_2
