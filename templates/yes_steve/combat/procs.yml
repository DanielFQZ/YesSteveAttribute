# 通用概率事件。普通暴击和元素暴击都使用同一套 Proc 管线。
procs:
  - id: empyrean:physical_critical
    name: 普通暴击
    group: critical
    roll_scope: hit
    when: "attack.contains('physical')"
    chance: "clamp(<暴击率> - <目标.暴击抵抗>, 0, 1)"
    effects:
      - mark: critical
      - multiply_damage: "<暴击倍率>"
      - emit: empyrean:critical_hit

  - id: empyrean:fire_critical
    name: 火焰暴击
    group: critical
    roll_scope: hit
    when: "attack.contains('fire')"
    chance: "clamp(<火焰暴击率> - <目标.火焰暴击抵抗>, 0, 1)"
    effects:
      - mark: critical
      - multiply_damage: "<火焰暴击倍率>"
      - emit: empyrean:fire_critical

groups:
  - id: critical
    # 同一个 group 默认只允许一个成功的 Proc。
    exclusive: true
    rng: attack_rng
