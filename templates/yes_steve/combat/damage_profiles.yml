# 伤害配置只描述一次命中的组成，最终由平台适配器调用一次原版 hurt。
profiles:
  - id: empyrean:light_slash
    name: 轻斩
    tags: [melee, weapon_attack]
    components:
      - type: physical
        amount: "<攻击强度> * 1.20"
    processors:
      - empyrean:physical_resistance
      - empyrean:critical_group
    vanilla:
      damage_type: minecraft:player_attack
      call_once: true

  - id: empyrean:burning_tick
    name: 燃烧持续伤害
    tags: [dot, fire]
    components:
      - type: fire
        amount: "<攻击强度> * 0.25"
    processors:
      - empyrean:fire_resistance
    vanilla:
      damage_type: minecraft:on_fire
      call_once: true
