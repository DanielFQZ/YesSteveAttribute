# 普通装备示例。实例身份和当前属性贡献分开保存。
items:
  - id: empyrean:iron_sword_01
    name: 试制铁剑
    kind: equipment
    slot: main_hand
    instance_policy: live
    base_item: minecraft:iron_sword
    instance_data:
      save: [item_id, roll_seed, upgrade_level]
      locked: [item_id]
    contributions:
      - attribute: empyrean:weapon_power
        formula: "18 + <强化等级> * 4"
    strengthen:
      max_level: 10
      cost_formula: "1000 + <强化等级> * 500"
      chance_formula: "Math.max(0.2, 1 - <强化等级> * 0.05)"

affixes:
  - id: empyrean:keen
    name: 锐利
    contributions:
      - attribute: empyrean:crit_chance
        value: 0.03
  - id: empyrean:ember
    name: 余烬
    contributions:
      - attribute: empyrean:fire_crit_chance
        value: 0.08
      - attribute: empyrean:fire_penetration
        value: 0.05

sets:
  - id: empyrean:starter_equipment
    items: [empyrean:iron_sword_01]
