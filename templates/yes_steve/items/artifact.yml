# 圣遗物风格来源域：五个固定部位、主词条、副词条、强化和套装。
artifact_system:
  domain: empyrean:artifact
  slots: [flower, plume, sands, goblet, circlet]
  instance_policy: frozen
  identity_fields: [item_id, roll_seed, level, main_stat, sub_stats, set_id]
  locked_fields: [item_id, roll_seed]

main_stats:
  flower: empyrean:max_health
  plume: empyrean:strength
  sands: empyrean:attack_power
  goblet: empyrean:fire_penetration
  circlet: empyrean:crit_chance

items:
  - id: empyrean:ember_flower
    name: 余烬之花
    slot: flower
    set_id: empyrean:ember_set
    level: 12
    main_stat:
      attribute: empyrean:max_health
      value: 180
    sub_stats:
      - attribute: empyrean:strength
        value: 12
      - attribute: empyrean:crit_chance
        value: 0.04

  - id: empyrean:ember_circlet
    name: 余烬冠冕
    slot: circlet
    set_id: empyrean:ember_set
    level: 8
    main_stat:
      attribute: empyrean:crit_chance
      value: 0.12
    sub_stats:
      - attribute: empyrean:fire_crit_multiplier
        value: 0.10

sets:
  - id: empyrean:ember_set
    name: 余烬套装
    bonuses:
      - pieces: 2
        effects:
          - contribution:
              attribute: empyrean:fire_penetration
              value: 0.08
      - pieces: 4
        effects:
          - event_effect: empyrean:burning_edge
