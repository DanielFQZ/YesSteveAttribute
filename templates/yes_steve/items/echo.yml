# 声骸风格来源域：费用、声骸技能、共鸣套装和调谐。
echo_system:
  domain: empyrean:echo
  slots: 5
  cost_limit_formula: "10 + Math.floor(<lvl> / 20)"
  instance_policy: frozen
  identity_fields: [item_id, roll_seed, cost, skill_id, sonata_id, tuning_level]
  locked_fields: [item_id, roll_seed]

items:
  - id: empyrean:ember_wolf_echo
    name: 余烬狼声骸
    cost: 4
    skill_id: empyrean:ember_wolf_skill
    sonata_id: empyrean:ember_sonata
    tuning_level: 2
    main_stat:
      attribute: empyrean:fire_crit_chance
      value: 0.06
    sub_stats:
      - attribute: empyrean:strength
        value: 10
      - attribute: empyrean:fire_penetration
        value: 0.04

  - id: empyrean:ash_sprite_echo
    name: 灰烬精灵声骸
    cost: 3
    skill_id: empyrean:ash_sprite_skill
    sonata_id: empyrean:ember_sonata
    tuning_level: 1
    main_stat:
      attribute: empyrean:fire_crit_multiplier
      value: 0.12
    sub_stats: []

sonata_sets:
  - id: empyrean:ember_sonata
    name: 余烬共鸣
    bonuses:
      - pieces: 2
        effects:
          - contribution:
              attribute: empyrean:fire_resistance
              value: 0.05
      - pieces: 5
        effects:
          - contribution:
              attribute: empyrean:fire_crit_multiplier
              value: 0.25
