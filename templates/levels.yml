# Level and experience rules
# Structure keys are English; conditions and formulas use the short variables <lvl> and <prev>.

level_rules:
  默认:
    start: 1
    max: 100
    initial_exp: 0
    experience:
      segments:
        - when: "<lvl> <= 10"
          formula: "500 + 120 * <lvl>"
        - when: "<lvl> <= 30"
          formula: "1000 * Math.pow(<lvl>, 1.35)"
        - when: "<lvl> > 30"
          formula: "<prev> * 1.25"
    promotion:
      - when: "<lvl> < 10"
        requirements: []
      - when: "<lvl> >= 10 && <lvl> % 10 == 0"
        requirements:
          - type: quest
            value: 升阶任务_1
        on_fail: block
    overflow_exp: keep
