# 属性定义模板
# 文件编码：UTF-8。属性名可以直接使用中文；这里的名称也是 NBT/Lore 读取时的匹配名称。
# 这里只定义“有什么属性”和它们的基本元数据，不在这里写计算公式。
# 装备读取协议暂不另设配置文件：实现会读取物品 NBT/Lore 中与此处名称完全匹配的属性。
# 示例协议（最终字段格式仍需确认）：NBT attributes: {力量: 10}；Lore 行：力量: +10。

一级属性:
  力量:
    类型: 面板属性
    单位: 点
    默认值: 0
    显示: true
    可修改来源: [角色, 装备标签, 装备Lore, Buff, 技能]
