# Attribute definitions
# UTF-8. The YAML structure uses English keys; attribute IDs and display names may be Chinese.
# Categories are for designers and UI only. All attributes are read through the same runtime API.
# Do not add source fields here. The runtime debug trace records where a value came from.

attributes:
  primary:
    力量:
      type: number
      unit: 点
      default: 0
      visible: true
    耐力:
      type: number
      unit: 点
      default: 0
      visible: true
    敏捷:
      type: number
      unit: 点
      default: 0
      visible: true
    精神:
      type: number
      unit: 点
      default: 0
      visible: true
    智力:
      type: number
      unit: 点
      default: 0
      visible: true
    专注:
      type: number
      unit: 点
      default: 0
      visible: true

  combat:
    武器伤害: {type: number, unit: 点, default: 0, visible: true}
    护甲: {type: number, unit: 点, default: 0, visible: true}
    暴击: {type: number, unit: 点, default: 0, visible: true}
    暴击抗性: {type: number, unit: 点, default: 0, visible: true}
    暴击倍率: {type: multiplier, unit: 倍率, default: 1.5, visible: true}

  element_weight:
    炽炎: {type: number, unit: 权重, default: 0, visible: false}
    冰霜: {type: number, unit: 权重, default: 0, visible: false}
    狂风: {type: number, unit: 权重, default: 0, visible: false}
    雷暴: {type: number, unit: 权重, default: 0, visible: false}
    圣光: {type: number, unit: 权重, default: 0, visible: false}
    暗影: {type: number, unit: 权重, default: 0, visible: false}

  element_resistance:
    炽炎抗性: {type: number, unit: 点, default: 0, visible: false}
    冰霜抗性: {type: number, unit: 点, default: 0, visible: false}
    狂风抗性: {type: number, unit: 点, default: 0, visible: false}
    雷暴抗性: {type: number, unit: 点, default: 0, visible: false}
    圣光抗性: {type: number, unit: 点, default: 0, visible: false}
    暗影抗性: {type: number, unit: 点, default: 0, visible: false}

  derived:
    基础伤害: {type: number, unit: 点, default: 0, visible: false}
    无属性伤害权重: {type: number, unit: 权重, default: 30, visible: false}
    总伤害权重: {type: number, unit: 权重, default: 30, visible: false}
    无属性伤害: {type: number, unit: 点, default: 0, visible: false}
    生命上限: {type: number, unit: 点, default: 0, visible: true}
    生命恢复速度: {type: number, unit: 点/秒, default: 0, visible: true}
    精力上限: {type: resource_max, unit: 点, default: 500, visible: true}
    精力恢复速度: {type: resource_rate, unit: 点/秒, default: 40, visible: true}
    充能上限: {type: resource_max, unit: 点, default: 100, visible: true}
    充能衰减速度: {type: resource_rate, unit: 点/秒, default: 0, visible: true}
    集中上限: {type: resource_max, unit: 点, default: 100, visible: true}
    集中恢复速度: {type: resource_rate, unit: 点/秒, default: 0, visible: true}
    基础伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    无属性伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    炽炎伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    冰霜伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    狂风伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    雷暴伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    圣光伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    暗影伤害加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    护甲减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    炽炎减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    冰霜减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    狂风减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    雷暴减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    圣光减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    暗影减伤加成: {type: multiplier, unit: 倍率, default: 1, visible: false}
    元素亲和: {type: enum, unit: 元素, default: 无, visible: false}

  runtime:
    精力值: {type: resource_current, unit: 点, default: 500, visible: true}
    充能值: {type: resource_current, unit: 点, default: 0, visible: true}
    集中值: {type: resource_current, unit: 点, default: 100, visible: true}
    炽炎伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    冰霜伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    狂风伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    雷暴伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    圣光伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    暗影伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    炽炎减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    冰霜减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    狂风减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    雷暴减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    圣光减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    暗影减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    暴击概率: {type: combat_value, unit: 概率, default: 0, visible: false}
    暴击前伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    暴击伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    元素伤害总和: {type: combat_value, unit: 点, default: 0, visible: false}
    元素减伤总和: {type: combat_value, unit: 点, default: 0, visible: false}
    护甲减伤: {type: combat_value, unit: 点, default: 0, visible: false}
    最终伤害: {type: combat_value, unit: 点, default: 0, visible: false}
    本次是否暴击: {type: combat_input, unit: 布尔值, default: 0, visible: false}

# Resource wiring is separate from attribute groups so other mods/plugins can use the same API.
resources:
  精力:
    current: 精力值
    maximum: 精力上限
    recovery: 精力恢复速度
    initial: maximum
  充能:
    current: 充能值
    maximum: 充能上限
    decay: 充能衰减速度
    initial: 0
  集中:
    current: 集中值
    maximum: 集中上限
    recovery: 集中恢复速度
    initial: maximum
