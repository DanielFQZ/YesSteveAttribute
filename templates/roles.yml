# Role and class base values
# Structure keys are English; role IDs, display names and attribute IDs may be Chinese.
# Only primary attributes are listed here. Derived values come from formulas.yml.

roles:
  示例战士:
    display_name: 示例战士
    level_rule: 默认
    upgrade_conditions: []
    base:
      力量: 10
      耐力: 12
      敏捷: 6
      精神: 4
      智力: 2
      专注: 3
    growth:
      力量: "10 + 0.6 * Math.pow(<lvl>, 1.6)"
      耐力: "12 + 0.8 * Math.pow(<lvl>, 1.5)"
      敏捷: "6 + 0.3 * <lvl>"
      精神: "4 + 0.2 * <lvl>"
      智力: "2 + 0.1 * <lvl>"
      专注: "3 + 0.15 * <lvl>"

  示例法师:
    display_name: 示例法师
    level_rule: 默认
    upgrade_conditions: []
    base:
      力量: 2
      耐力: 6
      敏捷: 5
      精神: 8
      智力: 12
      专注: 10
    growth:
      力量: "2 + 0.1 * <lvl>"
      耐力: "6 + 0.4 * Math.pow(<lvl>, 1.4)"
      敏捷: "5 + 0.25 * <lvl>"
      精神: "8 + 0.5 * <lvl>"
      智力: "12 + 0.8 * Math.pow(<lvl>, 1.5)"
      专注: "10 + 0.7 * Math.pow(<lvl>, 1.4)"
